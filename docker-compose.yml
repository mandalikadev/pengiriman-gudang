# Layanan pengembangan lokal: PostgreSQL 16 dan MinIO (storage S3).
# Image resmi minio/minio sudah tidak tersedia di Docker Hub; dipakai build fork komunitas pgsty/minio.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mandalika
      POSTGRES_PASSWORD: mandalika
      POSTGRES_DB: mandalika
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandalika"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
