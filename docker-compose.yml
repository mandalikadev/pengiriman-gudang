# Layanan pengembangan lokal: PostgreSQL 16 dan MinIO (storage S3).
# Port host khusus proyek (T74) agar tidak bentrok dengan proyek lain: PostgreSQL 55432, MinIO 59000 (API) dan
# 59001 (konsol). Port di dalam container tetap bawaan. CI memakai layanannya sendiri di 5432 dan 9000 (.env.ci).
# Image resmi minio/minio sudah tidak tersedia di Docker Hub; dipakai build fork komunitas pgsty/minio.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mandalika
      POSTGRES_PASSWORD: mandalika
      POSTGRES_DB: mandalika
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandalika"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
